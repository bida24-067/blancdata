name: Security & Privacy Audit

on:
  schedule:
    # Runs every day at 01:00 UTC (covers downtime window)
    - cron: "0 1 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the report back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (JSON)
        run: |
          npm audit --json > audit/npm-audit.json || true

      - name: Run ESLint (JSON output)
        run: |
          npx eslint . -f json -o audit/eslint-report.json || true

      - name: Privacy scan (simple regex)
        run: |
          node audit/privacy_scan.js > audit/privacy-report.json || true

      - name: Generate markdown report
        run: node audit/generate_report.js

      - name: Commit and push report
        env:
          GIT_AUTHOR_NAME: "github-actions"
          GIT_AUTHOR_EMAIL: "github-actions@github.com"
          GIT_COMMITTER_NAME: "github-actions"
          GIT_COMMITTER_EMAIL: "github-actions@github.com"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add audit/REPORT_V1_$(date +%Y-%m-%d).md
          git commit -m "Add security & privacy audit report for $(date +%Y-%m-%d)"
          git push
