name: Weekly Audit Notification

on:
  schedule:
    # Every Monday at 04:00 UTC (adjust if you prefer another time)
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # to read the report file
      issues: write    # to create a GitHub issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine latest report
        id: latest_report
        run: |
          latest=$(ls -1 audit/REPORT_V1_*.md | sort -V | tail -n1)
          echo "report=$latest" >> $GITHUB_OUTPUT

      - name: Post GitHub issue with report link
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.latest_report.outputs.report }}
        with:
          script: |
            const title = `Weekly Security & Privacy Audit – ${new Date().toISOString().slice(0,10)}`;
            const reportPath = process.env.REPORT_PATH;
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const sha = process.env.GITHUB_SHA;
            const reportUrl = `${repoUrl}/blob/${sha}/${reportPath}`;
            const body = `The latest audit report is available here:\n\n[${reportPath}](${reportUrl})\n\nYou can also view the file in the repository under the \`audit/\` folder.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
